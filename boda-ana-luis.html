<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yola - Invitación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFFBF7;font-family:'Inter',sans-serif;color:#1A1A1A;display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.card{background:white;width:100%;max-width:440px;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.04)}
.photo-wrap{position:relative;height:380px;overflow:hidden}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-gradient{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.05) 0%, rgba(0,0,0,0) 40%, rgba(255,255,255,.85) 85%, white 100%)}
.no-photo{height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFFBF7 0%,#fff 100%)}
.no-photo .ornament{width:64px;height:1px;background:#4A7C9C;opacity:.5;position:relative}
.no-photo .ornament:before{content:'✦';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;padding:0 8px;color:#4A7C9C;font-size:10px}
.content{padding:32px 36px 36px;text-align:center}
.label{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#8A8A8A;font-weight:500;margin-bottom:18px}
.names{font-family:'Playfair Display',serif;font-size:46px;line-height:.95;font-weight:600;color:#4A7C9C;margin-bottom:8px;letter-spacing:-.02em}
.date-main{font-family:'Playfair Display',serif;font-size:17px;color:#2A2A2A;margin-top:18px;line-height:1.5}
.time{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8A8A;margin-top:6px}
.divider{width:40px;height:1px;background:#4A7C9C;opacity:.3;margin:28px auto}
.frase{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;line-height:1.6;color:#5A5A5A;padding:0 8px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0 8px}
.countdown-box{border:1px solid #4A7C9C22;background:#4A7C9C08;border-radius:14px;padding:14px 4px}
.countdown-box b{font-family:'Playfair Display',serif;font-size:22px;display:block;color:#4A7C9C;line-height:1}
.countdown-box span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A;margin-top:6px;display:block;font-weight:500}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.btn{appearance:none;border-radius:100px;padding:14px 22px;font-size:14px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;transition:.2s}
.btn-primary{background:#4A7C9C;color:white;border:1px solid #4A7C9C;box-shadow:0 4px 18px #4A7C9C33}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px #4A7C9C44}
.btn-secondary{background:white;color:#1A1A1A;border:1px solid #E8E3DE}
.btn-secondary:hover{border-color:#4A7C9C44;background:#FFFBF7}
.footer{margin-top:32px;padding-top:20px;border-top:1px solid #F2EFEB;font-size:11px;color:#B0A9A2;letter-spacing:.04em}
.music-btn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #E8E3DE;background:white;box-shadow:0 4px 20px rgba(0,0,0,.08);cursor:pointer;display:grid;place-items:center;z-index:50}
@media(max-width:480px){body{padding:0}.card{border-radius:0;max-width:100%;min-height:100vh;box-shadow:none}.content{padding:28px 24px 32px}.names{font-size:42px}}
</style>
</head>

<script>
(function(){
  const target = new Date("2027-09-03T17:00").getTime();
  function updateCD(){
    const now = Date.now();
    const diff = target - now;
    if(diff<=0){["cd-d","cd-h","cd-m","cd-s"].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent="0"}); return}
    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/(1000*60))%60);
    const s=Math.floor((diff/1000)%60);
    const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v};
    set("cd-d",d); set("cd-h",h); set("cd-m",m); set("cd-s",s);
  }
  if(document.getElementById("countdown")){updateCD(); setInterval(updateCD,1000);}
  const waBtn=document.getElementById("waBtn");
  if(waBtn){
    const phone="5528444664".replace(/[^0-9]/g,"");
    const dateTxt="Viernes, 3 de Septiembre de 2027";
    const msg="Hola, confirmo mi asistencia a la boda de Yola el "+dateTxt+" \u2764\uFE0F";
    waBtn.href="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
  }
  const mapBtn=document.getElementById("mapBtn");
  if(mapBtn){ mapBtn.href="https://www.google.com/maps/place/Plan+de+Guadalupe+3,+San+Lorenzo+la+Cebada,+Xochimilco,+16035+Ciudad+de+M%C3%A9xico,+CDMX/@19.2773854,-99.1202889,18z/data=!4m6!3m5!1s0x85ce0171847cd331:0xa9593c6bbb17b6ef!8m2!3d19.2835453!4d-99.1174404!16s%2Fg%2F11gh_77k61?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D"; }
  const audio=document.getElementById("bgAudio");
  const musicBtn=document.getElementById("musicBtn");
  if(audio && musicBtn){
    let playing=false;
    musicBtn.addEventListener("click",()=>{
      if(playing){audio.pause(); musicBtn.textContent="♫";} else {audio.play().catch(()=>{}); musicBtn.textContent="❚❚";}
      playing=!playing;
    });
  }
})();
</script>
